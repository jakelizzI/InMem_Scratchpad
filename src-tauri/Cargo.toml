[package]
name = "inmem-memo"
version = "1.0.0"
description = "Ultra-Fast In-Memory Scratchpad Memo App"
authors = ["Antigravity"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# Default features
default = ["custom-protocol"]
# Feature for custom protocols
custom-protocol = ["tauri/custom-protocol"]
